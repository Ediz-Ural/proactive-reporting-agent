[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "proactive-reporting-agent"
version = "0.1.0"
description = "Multi-agent proactive reporting system for automated data analysis and report delivery"
requires-python = ">=3.10"
dependencies = [
    # Core LLM & Agents
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "chromadb>=0.5",
    "openai>=1.50",

    # Data
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",

    # Analysis
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "prophet>=1.1",
    "pymannkendall>=1.4",
    "scipy>=1.13",

    # Reporting
    "markdown>=3.5",
    "jinja2>=3.1",
    "python-docx>=1.1",
    "matplotlib>=3.9",
    "plotly>=5.24",

    # API & Infra
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "apscheduler>=3.10",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
