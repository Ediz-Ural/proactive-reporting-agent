server {
    listen 80;
    server_name localhost;

    # ── Security headers ─────────────────────────────────────────────────────
    # Users keep their own OpenAI key in localStorage, so script injection is
    # the threat that matters here: script-src allows nothing but our own
    # bundle, and there is no inline script in the build.
    # 'unsafe-inline' in style-src is required by React/Recharts inline styles;
    # it permits styling, not code execution.
    # connect-src also names the API's default dev origin — deployments that
    # build with VITE_API_URL should replace it with their own API origin.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8000; frame-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }
}
